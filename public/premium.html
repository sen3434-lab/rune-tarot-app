<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OZ 룬타로 · 프리미엄 룬</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#bc6338"/>
<link rel="icon" href="/icons/icon-192.png"/>
<style>
  .hero { text-align: center; padding: 10px 0 6px; }
  .hero-eyebrow { font-size: 10.5px; letter-spacing: 5px; color: var(--primary); font-weight: 600; text-transform: uppercase; }
  .hero h1 { font-size: 20px; line-height: 1.5; margin-top: 8px; }

  .coin-note { text-align: center; padding: 18px; background: var(--secondary); border-radius: 16px; margin-top: 20px; font-size: 13px; line-height: 1.7; }
  .coin-note strong { color: var(--primary-dark); }
</style>
</head>
<body>

<div class="topbar">
  <a href="/index.html" class="brand">OZ <span>ᚱ</span> 룬타로</a>
  <div class="topbar-actions">
    <a href="/coins.html" class="icon-btn" id="coinBadge" style="font-weight:600;color:var(--primary-dark);">🪙</a>
    <a href="/settings.html" class="icon-btn">계정</a>
  </div>
</div>

<div class="container">
  <div class="hero">
    <div class="hero-eyebrow">Premium Reading</div>
    <h1>삶의 네 영역, 깊이 있는 룬 리딩</h1>
    <p class="muted small mt-8">애정 · 재물 · 주거 · 건강 — 네 영역 모두 한 번 읽을 때 코인 1개로 만나보실 수 있어요.</p>
  </div>

  <div class="premium-grid">
    <a class="premium-card" href="/love.html">
      <div class="ic">💗</div>
      <div class="title">애정룬</div>
      <div class="desc">연애 · 관계 · 결혼운</div>
    </a>
    <a class="premium-card" href="/stock.html">
      <div class="ic">📈</div>
      <div class="title">재물룬</div>
      <div class="desc">돈을 대하는 마음 · 재물의 흐름</div>
    </a>
    <a class="premium-card" href="/realestate.html">
      <div class="ic">🏠</div>
      <div class="title">주거룬</div>
      <div class="desc">집 · 터 · 이사 · 입주운</div>
    </a>
    <a class="premium-card" href="/health.html">
      <div class="ic">🌿</div>
      <div class="title">건강룬</div>
      <div class="desc">몸과 마음의 상태</div>
    </a>
  </div>

  <div class="coin-note">
    <div>ᚱ ✦ ᛟ</div>
    <p style="margin-top:8px;">풀이는 <strong>한 번에 코인 1개</strong>예요. 열어본 풀이는 <a href="/history.html" style="color:var(--primary-dark);font-weight:600;">기록</a>에 저장되어 언제든 다시 볼 수 있어요.</p>
    <a href="/coins.html" class="btn btn-primary mt-16">내 코인 · 충전하기</a>
  </div>
</div>

<script type="module">
import { getSession, getMember, renderBottomNav, claimFreeCoins, renderCoinBadge } from '/js/app.js';

renderBottomNav('/premium.html');

(async () => {
  const session = await getSession();
  if (session) {
    await getMember(session);
    await claimFreeCoins(session);
  }
  await renderCoinBadge(document.getElementById('coinBadge'));
})();
</script>
</body>
</html>
