<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OZ 룬타로 · 설정</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#bc6338"/>
<link rel="icon" href="/icons/icon-192.png"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<style>
  .profile-head { text-align: center; padding: 10px 0 26px; }
  .avatar { width: 62px; height: 62px; border-radius: 50%; background: var(--secondary); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 12px; }
  .profile-head .email { font-size: 14px; font-weight: 500; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 0.8px solid var(--border); font-size: 13.5px; }
  .row:last-child { border-bottom: none; }
  .row .rl { color: var(--muted-foreground); }
</style>
</head>
<body>

<div class="topbar">
  <a href="/index.html" class="brand">OZ <span>ᚱ</span> 룬타로</a>
  <div class="topbar-actions"></div>
</div>

<div class="container">
  <div id="soundSection">
    <div class="section-label">소리 · 진동</div>
    <div class="card mb-24">
      <div class="row">
        <span class="rl">룬 던지는 소리</span>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="soundToggle" style="width:20px;height:20px;"/>
          <span id="soundLabel" style="font-size:13px;"></span>
        </label>
      </div>
      <div class="row">
        <span class="rl">진동</span>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="vibeToggle" style="width:20px;height:20px;"/>
          <span id="vibeLabel" style="font-size:13px;"></span>
        </label>
      </div>
      <div class="row">
        <span class="rl">미리 느껴보기</span>
        <button class="btn btn-outline btn-sm" id="soundTestBtn">▶ 미리 체험하기</button>
      </div>
      <p class="small muted" style="padding:10px 0 4px;line-height:1.6;">룬 뽑기, 오늘의 룬, 프리미엄 룬에서 룬을 던질 때 나는 소리와 진동이에요. 소리를 끄고 진동만 켜도 돼요. 진동은 안드로이드 폰에서만 작동하고, 이 기기에만 적용돼요.</p>
    </div>
  </div>

  <div id="gate" style="display:none;" class="empty-state">
    <div class="ic">🔒</div>
    <p>설정은 로그인 후 확인하실 수 있어요.</p>
    <a href="/auth.html" class="btn btn-primary mt-16">로그인 하기</a>
  </div>

  <div id="content" style="display:none;">
    <div class="profile-head">
      <div class="avatar">🙂</div>
      <div class="email" id="userEmail"></div>
      <span class="badge mt-8" id="roleBadge"></span>
    </div>

    <div class="section-label">계정</div>
    <div class="card mb-24">
      <div class="row">
        <span class="rl">이름 / 예명</span>
        <span style="display:flex;gap:6px;align-items:center;">
          <input type="text" id="nameInput" placeholder="이름을 입력해주세요" style="border:0.8px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;width:120px;"/>
          <button class="btn btn-outline btn-sm" id="saveNameBtn">저장</button>
        </span>
      </div>
      <div class="row"><span class="rl">등급</span><span id="rowRole"></span></div>
      <div class="row"><span class="rl">보유 코인</span><span><a href="/coins.html" id="rowCoins" style="color:var(--primary-dark);font-weight:600;">-</a></span></div>
      <div class="row"><span class="rl">가입일</span><span id="rowJoined"></span></div>
    </div>

    <div id="generalSection">
      <div class="section-label">일반</div>
      <div class="card mb-24">
        <div class="row" id="rowVerify">
          <span class="rl">정규 수강생 인증</span>
          <a href="/verify-student.html" class="btn btn-outline btn-sm">인증하기</a>
        </div>
        <div class="row">
          <span class="rl">코인 충전 · 내역</span>
          <a href="/coins.html" class="btn btn-outline btn-sm">보기</a>
        </div>
        <div class="row" id="rowAdmin" style="display:none;">
          <span class="rl">운영자 도구</span>
          <a href="/admin.html" class="btn btn-outline btn-sm">코인 지급</a>
        </div>
      </div>
    </div>

    <button class="btn btn-outline btn-block" id="logoutBtn">로그아웃</button>
    <button class="btn btn-danger btn-block mt-16" id="deleteBtn">회원 탈퇴 문의</button>
  </div>
</div>

<script type="module">
import { getSb, getSession, getMember, getBalance, signOut, renderBottomNav, fmtDate, showToast } from '/js/app.js';
import { isSoundOn, setSoundOn, isVibeOn, setVibeOn, canVibrate, startCastSound, stopCastSound } from '/js/castSound.js';
renderBottomNav('/settings.html');

// ---- 소리 설정 (로그인 없이도 바꿀 수 있다)
const soundToggle = document.getElementById('soundToggle');
const soundLabel = document.getElementById('soundLabel');
const vibeToggle = document.getElementById('vibeToggle');
const vibeLabel = document.getElementById('vibeLabel');
const soundTestBtn = document.getElementById('soundTestBtn');
let testTimer = null;
function paintSound() {
  const s = isSoundOn();
  soundToggle.checked = s;
  soundLabel.textContent = s ? '켜짐' : '꺼짐';
  if (!canVibrate()) {
    vibeToggle.checked = false;
    vibeToggle.disabled = true;
    vibeLabel.textContent = '이 기기는 지원하지 않아요';
  } else {
    const v = isVibeOn();
    vibeToggle.checked = v;
    vibeLabel.textContent = v ? '켜짐' : '꺼짐';
  }
  soundTestBtn.disabled = !(s || (canVibrate() && vibeToggle.checked));
}
paintSound();
soundToggle.addEventListener('change', () => {
  setSoundOn(soundToggle.checked);
  clearTimeout(testTimer);
  paintSound();
  showToast(soundToggle.checked ? '소리를 켰어요' : '소리를 껐어요');
});
vibeToggle.addEventListener('change', () => {
  setVibeOn(vibeToggle.checked);
  clearTimeout(testTimer);
  paintSound();
  showToast(vibeToggle.checked ? '진동을 켰어요' : '진동을 껐어요');
});
soundTestBtn.addEventListener('click', () => {
  if (soundTestBtn.disabled) return;
  startCastSound(); // 눌렀을 때 바로 시작해야 브라우저가 소리·진동을 허용한다
  clearTimeout(testTimer);
  testTimer = setTimeout(stopCastSound, 2200);
});

let currentSession = null;

async function init() {
  const session = await getSession();
  currentSession = session;
  if (!session) {
    document.getElementById('gate').style.display = 'block';
    return;
  }
  document.getElementById('content').style.display = 'block';
  document.getElementById('userEmail').textContent = session.user.email;

  const member = await getMember(session);
  if (!member) return;

  document.getElementById('nameInput').value = member.display_name || '';

  const roleLabel = member.role === 'student' ? '🎓 정규 수강생' : '일반 회원';
  document.getElementById('roleBadge').textContent = roleLabel;
  document.getElementById('roleBadge').className = 'badge mt-8 ' + (member.role === 'student' ? 'badge-student' : 'badge-free');
  document.getElementById('rowRole').textContent = roleLabel;

  document.getElementById('rowCoins').textContent = '🪙 ' + (await getBalance()) + '코인';
  const { data: isAdmin } = await (await getSb()).rpc('am_i_admin');
  if (isAdmin === true) document.getElementById('rowAdmin').style.display = 'flex';
  document.getElementById('rowJoined').textContent = member.created_at ? fmtDate(member.created_at) : '-';

  const isStudent = member.role === 'student';
  document.getElementById('rowVerify').style.display = isStudent ? 'none' : 'flex';
  if (isStudent) {
    document.getElementById('generalSection').style.display = 'none';
  }
}
init();

document.getElementById('saveNameBtn').addEventListener('click', async () => {
  if (!currentSession) return;
  const name = document.getElementById('nameInput').value.trim();
  const sb = await getSb();
  const { error } = await sb.from('members').update({ display_name: name || null }).eq('id', currentSession.user.id);
  if (error) {
    showToast('저장에 실패했어요.');
  } else {
    showToast('이름을 저장했어요 ✓');
  }
});

document.getElementById('logoutBtn').addEventListener('click', signOut);
document.getElementById('deleteBtn').addEventListener('click', () => {
  alert('회원 탈퇴는 010-2426-9731(문자) 또는 ozmaj@naver.com 으로 문의해주세요.');
});
</script>
</body>
</html>
